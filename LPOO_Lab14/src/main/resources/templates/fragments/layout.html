<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ========== HEAD: Bootstrap 5 + iconos ========== -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | GameStore'">GameStore</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">


    <style>
        .navbar-gamer { background-color: #1b1b2f;
                        border-bottom: 3px solid #6f42c1; }
        .icono-juego {
            width: 42px; height: 42px; border-radius: 10px;
            display: inline-flex; align-items: center;
            justify-content: center; font-size: 1.3rem;
            background-color: var(--bs-primary-bg-subtle);
            color: var(--bs-primary-text-emphasis);
        }
        .tarjeta-dato .icono {
            width: 52px; height: 52px; border-radius: 12px;
            display: inline-flex; align-items: center;
            justify-content: center; font-size: 1.6rem;
        }
    </style>
</head>

<body>

<!-- ========== BARRA DE NAVEGACIÓN ========== -->
<nav th:fragment="navbar(activo)"
     class="navbar navbar-expand-lg navbar-gamer shadow-sm"
     data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/videojuegos}">
            <i class="bi bi-controller me-2"></i>GameStore
        </a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false"
                aria-label="Mostrar menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/videojuegos}"
                       th:classappend="${activo == 'inventario'} ? 'active'">
                        <i class="bi bi-box-seam me-1"></i>Inventario
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/nuevo}"
                       th:classappend="${activo == 'nuevo'} ? 'active'">
                        <i class="bi bi-plus-circle me-1"></i>Nuevo juego
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ========== PIE DE PÁGINA ========== -->
<footer th:fragment="footer" class="text-center text-body-secondary small py-4">
    GameStore &middot; Sistema de inventario 
</footer>

<!-- ========== SCRIPTS (al final del body) ========== -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
