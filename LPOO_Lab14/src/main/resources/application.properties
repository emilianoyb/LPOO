spring.application.name=tienda-videojuegos

# ---------------------------------------------------------------
# Conexión a MySQL
# createDatabaseIfNotExist=true crea la base "tienda" si no existe.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/tienda?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Monterrey&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=jordanp6000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
