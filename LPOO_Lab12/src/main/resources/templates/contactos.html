<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agenda de Contactos</title>
    <style>
        body  { font-family: Arial, sans-serif; background: #1a1a2e;
                color: #e0e0e0; margin: 60px auto; max-width: 900px; }
        h1    { color: #f0c040; }
        .barra { display: flex; justify-content: space-between;
                 align-items: center; margin-bottom: 24px; }
        .btn  { background: #4a90d9; color: white; padding: 10px 18px;
                border-radius: 6px; text-decoration: none; border: none;
                font-size: .95em; cursor: pointer; }
        .btn-rojo { background: #c0392b; }
        table { width: 100%; border-collapse: collapse;
                background: #16213e; }
        th, td { padding: 12px 14px; text-align: left;
                 border-bottom: 1px solid #0f3460; }
        th    { background: #0f3460; color: #f0c040; }
        .acciones { display: flex; gap: 8px; }
        .acciones form { margin: 0; }
        .vacio { background: #16213e; border: 1px dashed #4a90d9;
                 padding: 30px; text-align: center; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="barra">
        <h1>Agenda de Contactos</h1>
        <a class="btn" th:href="@{/nuevo}">+ Nuevo contacto</a>
    </div>

    <div class="vacio" th:if="${#lists.isEmpty(contactos)}">
        Todavía no hay contactos guardados.
    </div>

    <table th:unless="${#lists.isEmpty(contactos)}">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Email</th>
                <th>Teléfono</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${contactos}">
                <td th:text="${c.nombre}">-</td>
                <td th:text="${c.apellido}">-</td>
                <td th:text="${c.email}">-</td>
                <td th:text="${c.telefono}">-</td>
                <td class="acciones">
                    <a class="btn"
                       th:href="@{/editar/{id}(id=${c.id})}">Editar</a>
                    <form th:action="@{/eliminar/{id}(id=${c.id})}"
                          method="post"
                          onsubmit="return confirm('¿Eliminar este contacto?');">
                        <button type="submit"
                                class="btn btn-rojo">Eliminar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
