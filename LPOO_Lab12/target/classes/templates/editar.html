<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Contacto</title>
    <style>
        body  { font-family: Arial, sans-serif; background: #1a1a2e;
                color: #e0e0e0; display: flex; justify-content: center;
                margin-top: 60px; }
        .caja { background: #16213e; padding: 40px; border-radius: 12px;
                border: 1px solid #4a90d9; width: 380px; }
        h1    { color: #f0c040; text-align: center; margin-bottom: 24px; }
        label { display: block; margin-bottom: 4px; color: #aaa;
                font-size: .9em; }
        input { width: 100%; padding: 10px; margin-bottom: 16px;
                background: #0f3460; border: 1px solid #4a90d9;
                border-radius: 6px; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #4a90d9;
                 border: none; border-radius: 6px; color: white;
                 font-size: 1em; cursor: pointer; }
        a     { display: block; text-align: center; margin-top: 16px;
                color: #4a90d9; }
    </style>
</head>
<body>
    <div class="caja">
        <h1>Editar Contacto</h1>
        <form th:action="@{/actualizar}" th:object="${contacto}"
              method="post">
            <input type="hidden" th:field="*{id}" />

            <label>Nombre</label>
            <input type="text" th:field="*{nombre}" required />

            <label>Apellido</label>
            <input type="text" th:field="*{apellido}" required />

            <label>Email</label>
            <input type="email" th:field="*{email}" required />

            <label>Teléfono</label>
            <input type="tel" th:field="*{telefono}" />

            <button type="submit">Actualizar contacto</button>
        </form>
        <a href="/contactos">← Cancelar y volver a la lista</a>
    </div>
</body>
</html>
